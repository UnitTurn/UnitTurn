<text x="62" y="300" font-size="13" fill="#8294a8">OPEN SOURCE / SYSTEMS / AUTHENTICATION</text>
<text x="62" y="340" font-size="13" fill="#55f0cb">&gt; curiosity is the starting point.</text>
